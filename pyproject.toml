[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pybi"
version = "0.1.0"
description = "OpenBI / PyBI - Python Business Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nicegui>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "duckdb>=0.9.0",
    "polars>=0.20.0",
    "pydantic>=2.0.0",
    "pyjwt>=2.8.0",
    "casbin>=1.30.0",
    "click>=8.1.0",
    "pyarrow"
]

[project.scripts]
pybi = "pybi.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["pybi*"]
