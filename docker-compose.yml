services:
  backend:
    build: .
    container_name: pybi_backend
    command: python3 -m backend.main
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - ./pybi_data:/app/data
    env_file:
      - .env
    restart: unless-stopped

  pybi:
    build: .
    container_name: pybi
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./pybi_data:/app/data
    env_file:
      - .env
    restart: unless-stopped
