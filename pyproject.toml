[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pybi"
version = "0.1.0"
description = "OpenBI / PyBI - Python Business Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nicegui>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "duckdb>=0.9.0",
    "polars>=0.20.0",
    "pydantic>=2.0.0",
    "pyjwt>=2.8.0",
    "casbin>=1.30.0",
    "click>=8.1.0",
    "pyarrow>=14.0.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.0.0",
    "ibis-framework[duckdb,sqlite,postgres]>=9.0",
    "sqlglot>=25.0",
    "jinja2>=3.0.0",
    "weasyprint>=50.0",
    "pyyaml>=6.0"
]

[project.scripts]
pybi = "pybi.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["pybi*"]

[tool.ruff]
lint.ignore = [
    "B008",     # Do not perform function call `Depends`/`File`/`Body` in argument defaults
    "B009",     # Do not call getattr with constant
    "ASYNC230",  # Async functions should not open files with blocking methods
    "BLE001",   # Do not catch blind exception: `Exception`
    "S110",     # `try`-`except`-`pass` detected
    "SIM103",   # Return condition directly
    "SIM114",   # Combine `if` branches using logical `or`
    "SIM117",   # Use a single `with` statement
    "SIM210",   # Remove unnecessary True if ... else False
    "RUF012",   # Mutable default value for class attribute
    "RUF022",   # __all__ is not sorted
    "PIE790",   # Unnecessary pass statement
    "UP006",    # Use `list` instead of `List`
    "UP007",    # Use `X | Y` for type annotations
    "UP012",    # Unnecessary UTF-8 encoding
    "UP035",    # `typing.Dict` is deprecated
    "UP045",    # Use `X | None`
    "I001",     # Import block is un-sorted
    "F401",     # Imported but unused
    "F841",     # Local variable assigned but never used
    "F541",     # f-string without placeholders
    "C414",     # Unnecessary list call in sorted
]
